name: letstalkAI
options:
  bundleIdPrefix: com.letstalkAI
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"

packages:
  SQLite.swift:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: "0.15.0"
  SVDB:
    url: https://github.com/Dripfarm/SVDB.git
    from: "2.0.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: "2.4.0"

targets:
  letstalkAI:
    type: application
    platform: iOS
    sources:
      - path: letstalkAI
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_FILE: letstalkAI/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.letstalkAI.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
    dependencies:
      - package: SQLite.swift
        product: SQLite
      - package: SVDB
        product: SVDB
      - package: SwiftSoup
        product: SwiftSoup
      - package: swift-markdown-ui
        product: MarkdownUI
    entitlements:
      path: letstalkAI/App/letstalkAI.entitlements
      properties:
        com.apple.developer.ml.foundation-models: true

  letstalkAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: letstalkAITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letstalkAI.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/letstalkAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/letstalkAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: letstalkAI

  letstalkAIIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: letstalkAIIntegrationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letstalkAI.integrationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/letstalkAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/letstalkAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: letstalkAI

  letstalkAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: letstalkAIUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.letstalkAI.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: letstalkAI
    dependencies:
      - target: letstalkAI

schemes:
  letstalkAI:
    build:
      targets:
        letstalkAI: all
        letstalkAITests: [test]
        letstalkAIIntegrationTests: [test]
        letstalkAIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - letstalkAITests
        - letstalkAIIntegrationTests
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
